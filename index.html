
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Kumora AI</title>
<style>
body {
  margin:0;
  background:#080812;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
header {
  padding:25px 10px;
  background:#17102e;
}
h1 {color:#b88cff;}
.box {
  margin:25px auto;
  padding:20px;
  max-width:500px;
}
textarea,select {
  width:90%;
  padding:14px;
  margin:12px 0;
  border-radius:10px;
  background:#19192a;
  color:white;
  border:1px solid #7653ad;
}
button {
  padding:15px 25px;
  border:0;
  border-radius:10px;
  background:#853cff;
  color:white;
  font-size:17px;
  margin:10px;
}
canvas {
  width:100%;
  border-radius:12px;
  background:#17102e;
}
</style>
</head>
<body>

<header>
<h1>🌌 DARK KUMORA AI</h1>
<p>Free Video Creator</p>
</header>

<div class="box">
<h2>अपना वीडियो बनाइए</h2>

<textarea id="story" rows="4"
placeholder="अपनी कहानी या वीडियो का टेक्स्ट लिखें..."></textarea>

<p>वीडियो की अवधि चुनें</p>

<select id="duration">
<option value="5">5 Seconds</option>
<option value="10" selected>10 Seconds</option>
<option value="20">20 Seconds</option>
</select>

<canvas id="screen" width="1280" height="720"></canvas>

<br>
<button onclick="makeVideo()">Create Video</button>

<p id="status">वीडियो बनाने के लिए तैयार</p>
<a id="download"></a>
</div>

<script>
async function makeVideo() {
 const story = document.getElementById("story").value.trim();
 const seconds = Number(document.getElementById("duration").value);
 const canvas = document.getElementById("screen");
 const ctx = canvas.getContext("2d");
 const status = document.getElementById("status");
 const download = document.getElementById("download");

 if(!story) {
   alert("पहले अपनी कहानी लिखें");
   return;
 }

 if(!canvas.captureStream || !window.MediaRecorder) {
   alert("आपके ब्राउज़र में वीडियो रिकॉर्डिंग उपलब्ध नहीं है");
   return;
 }

 download.removeAttribute("href");
 status.innerText="वीडियो बन रहा है...";

 const stream=canvas.captureStream(30);
 const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
 ? "video/webm;codecs=vp9" : "video/webm";

 const recorder=new MediaRecorder(stream,{mimeType:mime});
 const chunks=[];

 recorder.ondataavailable=e=>{
   if(e.data.size>0) chunks.push(e.data);
 };

 recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:"video/webm"});
   const url=URL.createObjectURL(blob);
   download.href=url;
   download.download="dark-kumora-video.webm";
   download.innerText="⬇ Download Your Video";
   status.innerText="आपका वीडियो तैयार है!";
   stream.getTracks().forEach(t=>t.stop());
 };

 let start=null;
 function draw(time) {
   if(!start) start=time;
   let progress=(time-start)/(seconds*1000);

   ctx.fillStyle="#080812";
   ctx.fillRect(0,0,1280,720);

   const gradient=ctx.createLinearGradient(0,0,1280,720);
   gradient.addColorStop(0,"#21104b");
   gradient.addColorStop(1,"#09091b");
   ctx.fillStyle=gradient;
   ctx.fillRect(0,0,1280,720);

   ctx.fillStyle="#b98cff";
   ctx.font="bold 48px Arial";
   ctx.textAlign="center";
   ctx.fillText("DARK KUMORA AI",640,160);

   ctx.fillStyle="white";
   ctx.font="bold 44px Arial";

   let words=story.split(" ");
   let lines=[];
   let line="";
   words.forEach(word=>{
     let test=line+word+" ";
     if(ctx.measureText(test).width>1000) {
       lines.push(line);
       line=word+" ";
     } else line=test;
   });
   lines.push(line);

   lines.slice(0,6).forEach((l,i)=>{
     ctx.fillText(l,640,310+i*65);
   });

   ctx.fillStyle="#a879ff";
   ctx.fillRect(0,650,1280*progress,8);

   if(progress<1) {
     requestAnimationFrame(draw);
   }
 }

 recorder.start();
 requestAnimationFrame(draw);

 setTimeout(()=>{
   if(recorder.state==="recording") recorder.stop();
 },seconds*1000);
}
</script>

</body>
</html>
